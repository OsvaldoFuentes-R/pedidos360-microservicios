# Kafka-UI: administración de brokers, tópicos, particiones, mensajes y consumer groups.
# Requiere el cluster Kafka levantado antes (docker-compose.yml de esta carpeta), porque se une a su red.
#   docker compose -f docker-compose.kafka-ui.yml up -d      -> http://localhost:8090
name: pedidos360-kafka-ui

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    networks: [kafka-net]
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: "false"
      # Acceso con usuario y contraseña (cámbialos en .env, sobre todo en AWS)
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-admin}
      JAVA_OPTS: -Xmx384m

networks:
  kafka-net:
    name: pedidos360-kafka
    external: true
