server:
  port: ${PORT:8087}

spring:
  application:
    name: ms-rabbitmq-admin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # El health de RabbitMQ de Spring falla si el nodo está caído: sirve para monitorear
  health:
    rabbit:
      enabled: true

# API HTTP de administración de RabbitMQ (puerto 15672): se usa solo para LISTAR colas, exchanges y bindings.
# Crear y borrar se hace por AMQP con AmqpAdmin.
rabbit-admin:
  management-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
  usuario: ${RABBITMQ_USER:guest}
  clave: ${RABBITMQ_PASSWORD:guest}
  vhost: ${RABBITMQ_VHOST:/}
  # Elementos de la arquitectura: no se pueden borrar sin ?forzar=true
  protegidos:
    exchanges: [pedidos360.exchange, pedidos360.dlx, pedidos360.unroutable]
    prefijos-colas: [pedidos.]
