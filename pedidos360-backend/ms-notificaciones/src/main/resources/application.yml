server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-notificaciones
  # Base de datos. Por defecto H2 en memoria (desarrollo). Para PostgreSQL en la nube (RDS) se definen
  # DB_URL (jdbc:postgresql://HOST:5432/BASE?sslmode=require&currentSchema=notificaciones), DB_USER y DB_PASSWORD
  # como variables de entorno; no se escriben credenciales en este archivo.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:notificacionesdb;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
  # Conexion a RabbitMQ. Por defecto apunta a localhost (guest/guest).
  # En AWS no se edita este archivo: se usan variables de entorno
  # (RABBITMQ_HOST / RABBITMQ_USER / RABBITMQ_PASSWORD, o SPRING_RABBITMQ_ADDRESSES
  # con la lista de nodos del cluster: ip1:5672,ip2:5672).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

# Endpoints de salud para Docker / balanceadores (/actuator/health)
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------------------------------------------------------------------
# Topologia de mensajeria. Es la MISMA en todos los servicios: cada servicio
# declara el exchange y solo las rutas que usa (lista "declarar").
#
#   pedidos360.exchange (direct) --routing key--> cola principal
#   cola principal --mensaje rechazado--> pedidos360.dlx (topic) --> cola DLQ
#   routing key sin binding --> pedidos360.unroutable (fanout) --> pedidos.noruteados
# ---------------------------------------------------------------------------
pedidos360:
  rabbitmq:
    exchange: pedidos360.exchange
    dlx: pedidos360.dlx
    unroutable-exchange: pedidos360.unroutable
    unroutable-queue: pedidos.noruteados
    declarar: [notificaciones]
    rutas:
      registro:
        queue: pedidos.registro
        routing-key: pedido.registro
        dlq: pedidos.registro.dlq
        dlq-routing-key: dlq.pedido.registro
      notificaciones:
        queue: pedidos.notificaciones
        routing-key: pedido.notificacion
        dlq: pedidos.notificaciones.dlq
        dlq-routing-key: dlq.pedido.notificacion
      tickets:
        queue: pedidos.tickets
        routing-key: pedido.ticket
        dlq: pedidos.tickets.dlq
        dlq-routing-key: dlq.pedido.ticket
