spring:
  application:
    name: pedidos360-bff
  rabbitmq:
    # Una sola EC2:  RABBITMQ_HOST=<ip>.  Cluster de 2 nodos: RABBITMQ_ADDRESSES=ipNodo1:5672,ipNodo2:5672
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    addresses: ${RABBITMQ_ADDRESSES:}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO

# Seguridad (Azure CIAM). Los IDs de tenant son identificadores públicos, no secretos.
seguridad:
  jwk-set-uri: ${JWK_SET_URI:https://pedido360seba2026.ciamlogin.com/39eb9615-c754-4ef1-96f8-4f61494df782/discovery/v2.0/keys}
  # Opcionales: si se definen, el token debe venir de ese issuer y dirigido a esa audiencia (client id de la API)
  issuer: ${JWT_ISSUER:}
  audience: ${JWT_AUDIENCE:}
  cors-origenes: ${CORS_ORIGENES:http://localhost:4200}

# Microservicios que consulta el BFF
servicios:
  pedidos-url: ${MS_PEDIDOS_URL:http://localhost:8083}
  productos-url: ${MS_PRODUCTOS_URL:http://localhost:8081}
  clientes-url: ${MS_CLIENTES_URL:http://localhost:8082}
  despacho-url: ${MS_DESPACHO_URL:http://localhost:8085}
  analitica-url: ${MS_ANALITICA_URL:http://localhost:8088}

# Topología RabbitMQ (misma que en ms-pedidos / ms-notificaciones / ms-despacho; deben ser idénticas)
pedidos360:
  rabbitmq:
    exchange: pedidos360.exchange
    dlx: pedidos360.dlx
    unroutable-exchange: pedidos360.unroutable
    unroutable-queue: pedidos.noruteados
    declarar: [registro, notificaciones, tickets]
    rutas:
      registro:
        queue: pedidos.registro
        routing-key: pedido.registro
        dlq: pedidos.registro.dlq
        dlq-routing-key: dlq.pedido.registro
      notificaciones:
        queue: pedidos.notificaciones
        routing-key: pedido.notificacion
        dlq: pedidos.notificaciones.dlq
        dlq-routing-key: dlq.pedido.notificacion
      tickets:
        queue: pedidos.tickets
        routing-key: pedido.ticket
        dlq: pedidos.tickets.dlq
        dlq-routing-key: dlq.pedido.ticket
